name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily live-API drift check against the game server.
    - cron: '17 6 * * *'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned deliberately. Now that tests gate the build, `latest` would let a
          # bun release turn CI red with no change in this repo.
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install
        working-directory: server

      - name: Build
        run: bun run build
        working-directory: server

      # GATING. Runs each test file in its own bun process; a single `bun test src/`
      # is nondeterministic (3 of 5 clean-tree runs red, different failures each time)
      # because test files leak global state into each other. See the script header.
      - name: Test (per-file isolation)
        run: ./scripts/run-tests-isolated.sh
        working-directory: server

      # NON-GATING, and the only step in this workflow that is. It runs exactly the
      # tests the runner above quarantines by name, so they stay visible instead of
      # silently rotting: a quarantined test that starts failing ALWAYS still shows up
      # here. It cannot gate because it is measured flaky (2/15) in a fully isolated
      # process. Justification and the required fix are in run-tests-isolated.sh.
      # Do not add steps to this exemption — fix or quarantine with evidence instead.
      - name: Quarantined flaky tests (informational)
        run: bun test src/services/log-streamer.test.ts -t 'log-streamer multi-subscriber fan-out'
        working-directory: server
        continue-on-error: true

  live-api-drift:
    # Deliberately not run on pull_request: this checks the live third-party game
    # server's schema, not the contributor's change. An outage there is real
    # information, but it must not block an unrelated PR from merging.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install
        working-directory: server

      # GATING for this job. Runs without SKIP_API_SYNC so the live check actually
      # executes, and in its own process so no other test file's fetch mock leaks in.
      - name: Live game API drift
        run: bun test src/proxy/schema-drift.test.ts
        working-directory: server
